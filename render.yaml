# مخطط Render: خدمة ويب واحدة + قاعدة بيانات Postgres مرتبطة بها تلقائياً.
services:
  - type: web
    name: nabd-altawari
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nabd-db
          property: connectionString
      - key: TZ_OFFSET_MINUTES
        value: "180"

databases:
  - name: nabd-db
    plan: free
    databaseName: nabd
    user: nabd
